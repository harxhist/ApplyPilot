            - paragraph [ref=e38]:
              - strong [ref=e39]: Job description
            - paragraph [ref=e40]: Our core mission at Railway is to let developers create, ship and operate software with minimal friction. Fundamental to that mission is an array of rock-solid and composable primitives, principal among these - storage.
            - paragraph [ref=e41]: As a Storage Engineer you will build, evolve and operate the systems that allow Railway to host stateful workloads. Railway operates across multiple colocation datacenters and large fleets of cloud VMs. This demands we build high-availability primitives that “work anywhere” and that can migrate between different environments with minimal (ideally zero) downtime. Moving storage is the hardest challenge in this task, and it has required us to invest in building custom systems from first-principles.
            - paragraph [ref=e42]: You will principally be working on our new log structured block-storage system that is designed for performance, high-density and high-availability across cloud and baremetal environments.
            - paragraph [ref=e43]:
              - text: Want to learn about our work culture? Here is a three-part blog series that will help you see the unique ways our team works (Parts
              - link "1" [ref=e44] [cursor=pointer]:
                - /url: https://blog.railway.app/p/how-we-work
              - text: ","
              - link "2" [ref=e45] [cursor=pointer]:
                - /url: https://blog.railway.app/p/how-we-work-volume-ii
              - text: ","
              - link "3" [ref=e46] [cursor=pointer]:
                - /url: https://blog.railway.app/p/how-we-work-volume-iii
              - text: ", and"
              - link "4" [ref=e47] [cursor=pointer]:
                - /url: https://blog.railway.com/p/how-we-work-volume-iv
              - text: ).
            - paragraph [ref=e48]:
              - text: "Curious? Here are 3 blog posts that dive into exciting projects this team has worked on:"
              - link "1" [ref=e49] [cursor=pointer]:
                - /url: https://blog.railway.com/p/launch-week-01-scale-to-zero
              - text: ","
              - link "2" [ref=e50] [cursor=pointer]:
