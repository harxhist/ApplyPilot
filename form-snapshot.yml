          - heading "Software Engineer, Model Routing & Inference" [level=1] [ref=e359]
          - paragraph [ref=e360]: Engineering · Full-time · New York; San Francisco
          - link "Apply" [ref=e361] [cursor=pointer]:
            - /url: "#apply"
            - text: Apply
            - generic [ref=e363]: ↓
        - generic [ref=e365]:
          - paragraph [ref=e366]: Our mission is to automate coding. The first step in our journey is to build the best tool for professional programmers, using a combination of inventive research, design, and engineering. Our organization is very flat, and our team is small and talent dense. We particularly like people who are truth-seeking, passionate, and creative. We enjoy spirited debate, crazy ideas, and shipping code.
          - heading "About the Role" [level=3] [ref=e367]:
            - strong [ref=e368]: About the Role
          - paragraph [ref=e369]:
            - text: As a Software Engineer on the
            - strong [ref=e370]: Model Routing & Inference
            - text: team at Cursor, you'll build the inference platform that powers every AI interaction in the product.
          - paragraph [ref=e371]: "This team owns the full inference path: making Cursor's AI faster, more reliable, and more cost-effective at a scale few teams in the world get to operate at. Every agent session, every tab completion, and every chat message flows through your stack."
          - paragraph
          - heading "Example projects include..." [level=3] [ref=e372]
          - list [ref=e373]:
            - listitem [ref=e374]:
              - paragraph [ref=e375]: Building and evolving our inference gateway, a single abstraction over every provider's API semantics, so model onboarding becomes a config change.
            - listitem [ref=e376]:
              - paragraph [ref=e377]: Designing intelligent cross-provider failover so no single provider outage causes user-visible degradation.
            - listitem [ref=e378]:
              - paragraph [ref=e379]: Designing routing backpressure and admission control so traffic spikes don't cascade into providers.
          - paragraph
          - heading "You may be a fit if" [level=3] [ref=e380]
          - list [ref=e381]:
            - listitem [ref=e382]:
              - paragraph [ref=e383]: You have deep experience building high-throughput, low-latency distributed systems, especially in inference serving, traffic routing, or real-time data pipelines.
            - listitem [ref=e384]:
              - paragraph [ref=e385]: You're comfortable reasoning about cost/performance tradeoffs at scale (GPU utilization, provider economics, capacity planning).
            - listitem [ref=e386]:
              - paragraph [ref=e387]: You have strong software engineering fundamentals and enjoy shipping production systems that handle millions of requests.
            - listitem [ref=e388]:
              - paragraph [ref=e389]: "You make good calls in the gray area: weighing reliability, cost, latency, and user experience when there isn't a single \"right\" answer."
          - paragraph
          - heading "Applying" [level=3] [ref=e390]
          - paragraph [ref=e391]: If there appears to be a fit, we'll reach to schedule 2-3 short technicals. After, we'll schedule an onsite in our office, where you'll work on a small project, discuss ideas, and meet the team.
          - paragraph
