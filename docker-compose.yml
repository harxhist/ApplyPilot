services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      APPLYPILOT_DIR: /data
      APPLY_MODE: off
      APPLYPILOT_REQUIRE_TOKEN: "1"
      APPLYPILOT_CORS_ORIGINS: "*"
    volumes:
      - applypilot_data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  applypilot_data:
