          - generic [ref=e21]:
            - strong [ref=e23]: About Us
            - generic [ref=e24]:
              - paragraph [ref=e25]: At Cloudflare, we are on a mission to help build a better Internet. Today the company runs one of the world’s largest networks that powers millions of websites and other Internet properties for customers ranging from individual bloggers to SMBs to Fortune 500 companies. Cloudflare protects and accelerates any Internet application online without adding hardware, installing software, or changing a line of code. Internet properties powered by Cloudflare all have web traffic routed through its intelligent global network, which gets smarter with every request. As a result, they see significant improvement in performance and a decrease in spam and other attacks. Cloudflare was named to Entrepreneur Magazine’s Top Company Cultures list and ranked among the World’s Most Innovative Companies by Fast Company.
              - paragraph [ref=e26]: At Cloudflare, we’re not looking for people who wait for a polished roadmap; we’re looking for the builders who see the cracks in the Internet that everyone else has simply learned to live with. We value candidates who have the instinct to spot a "normalized" problem and the AI-native curiosity to create a solution using the latest tools. Our culture is built on iteration, leveraging AI to ship faster today to make it better tomorrow, while ensuring that every improvement, no matter how small, is shared across the team to lift everyone up. If you’re the type of person who values curiosity over bureaucracy, and that AI is a partner in solving tough problems to keep the Internet moving forward, you’ll fit right in.
          - generic [ref=e27]:
            - heading "Software Engineer, AI Agents" [level=1] [ref=e28]:
              - strong [ref=e29]: Software Engineer, AI Agents
            - paragraph [ref=e30]:
              - strong [ref=e31]: "Location:"
              - text: India, Bangalore
            - 'heading "Exp: 5 - 10yrs" [level=2] [ref=e32]':
              - strong [ref=e33]: "Exp:"
              - text: 5 - 10yrs
            - heading "Why This Role Matters" [level=2] [ref=e34]:
              - strong [ref=e35]: Why This Role Matters
            - paragraph [ref=e36]: At Cloudflare, we're building industrial-scale AI agents that support customers directly. This isn't research theater. Your code will power real customer interactions from day one, at global scale.
            - paragraph [ref=e37]: Cloudflare already has the parts. You will assemble Workers, Durable Objects, KV, R2, D1, Vectorize, Workers AI, AI Gateway, and the Agent SDK into real agents customers use every day.
            - heading "Role Intent" [level=2] [ref=e38]:
              - strong [ref=e39]: Role Intent
            - paragraph [ref=e40]: Ship production agents on the Cloudflare stack. Build, deploy, learn, repeat. Your code is the front door for Cloudflare customers.
            - heading "What You Will Do" [level=2] [ref=e41]:
              - strong [ref=e42]: What You Will Do
            - list [ref=e43]:
              - listitem [ref=e44]: Build agents on Workers with Durable Objects for state and short term memory
              - listitem [ref=e45]: Wire tools with the Agent SDK, MCP, and function calling
              - listitem [ref=e46]: Use Vectorize, KV, R2, and D1 for semantic memory, cache, files, and config
              - listitem [ref=e47]: Run models through Workers AI and AI Gateway; integrate third parties when needed
              - listitem [ref=e48]: Create evals, guardrails, and audits. Measure, tune, re-ship fast
              - listitem [ref=e49]: Build agents that summarize, propose fixes, and escalate cleanly to humans
              - listitem [ref=e50]: Expose agent health and metrics in transparent dashboards. No mystery boxes
              - listitem [ref=e51]: Integrate with queues and webhooks; publish events on Queues or Pub/Sub
              - listitem [ref=e52]: Cut cost per case and time to first response. Prove it with data.
              - listitem [ref=e53]: Take end to end ownership including on call for what you ship (with team support)
              - listitem [ref=e54]: Design and maintain robust observability for distributed AI workflows, implementing structured logging and end-to-end tracing across async service boundaries to ensure visibility into agent reasoning and execution.
              - listitem [ref=e55]: Architect security boundaries for agent-led operations; implementing secure credential handling, multi-layer approval gates, and fine-grained trust scoping for mutative actions.
            - heading "Must Have" [level=2] [ref=e56]:
              - strong [ref=e57]: Must Have
            - list [ref=e58]:
              - listitem [ref=e59]: Demonstrated success shipping production systems. Repos and releases that show real work.
              - listitem [ref=e60]: Strong in TypeScript or Rust on Workers. HTTP, queues, async, performance
              - listitem [ref=e61]: Fluency with Durable Objects, KV or R2, and either D1 or Postgres
              - listitem [ref=e62]: Hands on with model tooling. Prompt I/O, tool calling, evals, safety checks
              - listitem [ref=e63]: Observability mindset. Logs, traces, metrics, redlines
              - listitem [ref=e64]: Experience with a2a/multi-agent frameworks
              - listitem [ref=e65]: Experience developing LLM evaluation frameworks; automated scoring systems, CI-integrated quality gates.
              - listitem [ref=e66]: Bias for simple, scalable designs
            - heading "Nice to Have" [level=2] [ref=e67]:
              - strong [ref=e68]: Nice to Have
            - list [ref=e69]:
              - listitem [ref=e70]: Workers AI, AI Gateway, and Vectorize in production
              - listitem [ref=e71]: Salesforce or Service Cloud experience. Webhooks and case APIs
              - listitem [ref=e72]: Security depth. Prompt injection protection, secrets detection, PII handling
              - listitem [ref=e73]: OSS agent frameworks. Know what to borrow and what to throw away.
            - heading "How We Build" [level=2] [ref=e74]:
              - strong [ref=e75]: How We Build
            - list [ref=e76]:
              - listitem [ref=e77]: Align fast on what matters.
              - listitem [ref=e78]: Divide and conquer. Own your piece.
              - listitem [ref=e79]: Ship. Watch customers use it.
              - listitem [ref=e80]: Learn and repeat.
            - heading "Why Join Cloudflare in India?" [level=2] [ref=e81]:
              - strong [ref=e82]: Why Join Cloudflare in India?
            - paragraph [ref=e83]:
              - strong [ref=e84]: "Impact at global scale:"
              - text: Your code will serve Cloudflare's customers across every region. Tens of millions of Internet properties depend on us.
            - paragraph [ref=e85]:
              - strong [ref=e86]: "Work on the edge:"
              - text: Few companies give engineers the chance to build AI directly into an edge platform that runs in 300+ cities worldwide.
            - paragraph [ref=e87]:
              - strong [ref=e88]: "Career growth:"
              - text: As one of the early engineers in our India based AI team, you'll have visibility, leadership opportunities, and a direct hand in shaping Cloudflare's AI roadmap.
            - paragraph [ref=e89]:
              - strong [ref=e90]: "Culture of ownership:"
              - text: We believe in autonomy, accountability, and trust. Engineers here own outcomes, not just tickets.
            - paragraph [ref=e91]:
              - strong [ref=e92]: "Learn and grow fast:"
              - text: Collaborate with peers across Support, Product, Security, and AI Platform teams. We encourage knowledge sharing, mentorship, and continuous learning.
            - heading "Interview Signal" [level=2] [ref=e93]:
              - strong [ref=e94]: Interview Signal
            - paragraph [ref=e95]: "Expect to demonstrate your ability to:"
            - list [ref=e96]:
              - listitem [ref=e97]: Build a mini agent on Workers using the Agent SDK
              - listitem [ref=e98]: Store session memory in Durable Objects
              - listitem [ref=e99]: Add semantic recall with Vectorize
              - listitem [ref=e100]: Ship behind a KV flag with traces and observability
              - listitem [ref=e101]: Push to production fast and take ownership
            - heading "Team Mission" [level=2] [ref=e102]:
              - strong [ref=e103]: Team Mission
            - paragraph [ref=e104]: The Agent Tech team owns the end to end stack for customer facing agents on Cloudflare. Everything runs at the edge.
            - paragraph [ref=e105]:
              - strong [ref=e106]: "Core Stack:"
              - text: Workers, Durable Objects, KV, R2, D1, Queues, Pub/Sub, Vectorize, Workers AI, AI Gateway, Pages, Zero Trust.
            - paragraph [ref=e107]:
              - strong [ref=e108]: "Principles:"
              - text: Ship fast. Measure truth. Simplify relentlessly. Own outcomes.
            - paragraph [ref=e109]
            - paragraph [ref=e110]:
              - strong [ref=e111]: "Fraud Alert:"
              - emphasis [ref=e112]: Do not fall victim to recruitment fraud. Cloudflare never charges application fees or requires candidates to purchase third-party certifications or training as a condition of employment. All official communication comes strictly from @
              - link "cloudflare.com" [ref=e113] [cursor=pointer]:
                - /url: http://cloudflare.com/
                - emphasis [ref=e115]: cloudflare.com
              - emphasis [ref=e116]: email addresses.
          - generic [ref=e117]:
            - paragraph [ref=e118]:
              - strong [ref=e119]: What Makes Cloudflare Special?
            - paragraph [ref=e120]: We’re not just a highly ambitious, large-scale technology company. We’re a highly ambitious, large-scale technology company with a soul. Fundamental to our mission to help build a better Internet is protecting the free and open Internet.
            - paragraph [ref=e121]:
              - link "Project Galileo" [ref=e122] [cursor=pointer]:
                - /url: https://blog.cloudflare.com/protecting-free-expression-online/
                - strong [ref=e123]: Project Galileo
              - text: ": Since 2014, we've equipped more than 2,400 journalism and civil society organizations in 111 countries with powerful tools to defend themselves against attacks that would otherwise censor their work, technology already used by Cloudflare’s enterprise customers--at no cost."
            - paragraph [ref=e124]:
              - strong [ref=e125]:
                - link "Athenian Project" [ref=e126] [cursor=pointer]:
                  - /url: https://www.cloudflare.com/athenian/
              - text: ": In 2017, we created the Athenian Project to ensure that state and local governments have the highest level of protection and reliability for free, so that their constituents have access to election information and voter registration. Since the project, we've provided services to more than 425 local government election websites in 33 states."
            - paragraph [ref=e127]:
              - link "1.1.1.1" [ref=e128] [cursor=pointer]:
                - /url: https://1.1.1.1/
                - strong [ref=e129]: 1.1.1.1
              - text: ": We released"
              - link "1.1.1.1" [ref=e130] [cursor=pointer]:
                - /url: https://1.1.1.1/
              - text: to help fix the foundation of the Internet by building a faster, more secure and privacy-centric public DNS resolver. This is available publicly for everyone to use - it is the first consumer-focused service Cloudflare has ever released. Here’s the deal - we don’t store client IP addresses never, ever. We will continue to abide by our
              - link "privacy commitment" [ref=e131] [cursor=pointer]:
                - /url: https://developers.cloudflare.com/1.1.1.1/privacy/public-dns-resolver
              - text: and ensure that no user data is sold to advertisers or used to target consumers.
            - paragraph [ref=e132]: Sound like something you’d like to be a part of? We’d love to hear from you!
            - paragraph [ref=e133]: Please note that applicants who progress to the offer stage of the interview process may be asked to attend an in-person interview within one of the Cloudflare Offices or Cloudflare Hubs. More details about this will be available at that stage of the interview process.
            - paragraph [ref=e134]: This position may require access to information protected under U.S. export control laws, including the U.S. Export Administration Regulations. Please note that any offer of employment may be conditioned on your authorization to receive software or technology controlled under these U.S. export laws without sponsorship for an export license.
            - paragraph [ref=e135]: Cloudflare is proud to be an equal opportunity employer. We are committed to providing equal employment opportunity for all people and place great value in both diversity and inclusiveness. All qualified applicants will be considered for employment without regard to their, or any other person's, perceived or actual race, color, religion, sex, gender, gender identity, gender expression, sexual orientation, national origin, ancestry, citizenship, age, physical or mental disability, medical condition, family care status, or any other basis protected by law. We are an AA/Veterans/Disabled Employer.
            - paragraph [ref=e136]: Cloudflare provides reasonable accommodations to qualified individuals with disabilities. Please tell us if you require a reasonable accommodation to apply for a job. Examples of reasonable accommodations include, but are not limited to, changing the application process, providing documents in an alternate format, using a sign language interpreter, or using specialized equipment. If you require a reasonable accommodation to apply for a job, please contact us via e-mail at hr@cloudflare.com or via mail at 101 Townsend St. San Francisco, CA 94107.
