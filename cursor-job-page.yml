      - generic [ref=e363]:
        - generic [ref=e364]:
          - heading "Software Engineer, Agent Harness" [level=1] [ref=e365]
          - paragraph [ref=e366]: Engineering · Full-time · San Francisco; New York
          - link "Apply" [ref=e367] [cursor=pointer]:
            - /url: "#apply"
            - text: Apply
            - generic [ref=e369]: ↓
        - generic [ref=e371]:
          - paragraph [ref=e372]: Our mission is to automate coding. The first step in our journey is to build the best tool for professional programmers, using a combination of inventive research, design, and engineering. Our organization is very flat, and our team is small and talent dense. We particularly like people who are truth-seeking, passionate, and creative. We enjoy spirited debate, crazy ideas, and shipping code.
          - heading "About the Role" [level=3] [ref=e373]:
            - strong [ref=e374]: About the Role
          - paragraph [ref=e375]:
            - text: As a Software Engineer on the
            - strong [ref=e376]: Agent Harness
            - text: team at Cursor, you’ll build the core agent behavior and capabilities that power agent experiences across Cursor products. This spans agent orchestration, tools, guardrails, and model behavior tuning—designed as a platform that Cursor engineers can extend and depend on.
          - paragraph [ref=e377]: Your work will also define the default Cursor agent experience (”Auto”), where users trust us to make the right model choices under real-world constraints.
          - paragraph
          - paragraph [ref=e378]: "Example projects include:"
          - list [ref=e379]:
            - listitem [ref=e380]:
              - paragraph [ref=e381]: Advancing the agent harness (agent loop, tools, prompts, execution environment, capabilities) used across Cursor products. This would shape and empower experiences like multi-agent coordination.
            - listitem [ref=e382]:
              - paragraph [ref=e383]: "Improving the default Cursor agent experience (the “Auto” model setting): making smart model choices based on user needs, model capabilities, and cost appetite."
            - listitem [ref=e384]:
              - paragraph [ref=e385]: Shaping the default Cursor agent’s personality.
            - listitem [ref=e386]:
              - paragraph [ref=e387]: Launching new models on Cursor end-to-end — partnering with foundational model providers and our research team on integration, evaluation, and rollout.
          - paragraph
          - heading "You may be a fit if" [level=3] [ref=e388]
          - list [ref=e389]:
            - listitem [ref=e390]:
              - paragraph [ref=e391]: You have built complex agentic products or infrastructure.
            - listitem [ref=e392]:
              - paragraph [ref=e393]: You have strong software engineering fundamentals and enjoy shipping production systems.
            - listitem [ref=e394]:
              - paragraph [ref=e395]: You have taste and strong opinions on model and agent behaviors. You stay up-to-date and informed on emerging research and industry trends.
            - listitem [ref=e396]:
              - paragraph [ref=e397]: "You make good calls in the gray area: weighing data, user experience, and product taste when there isn’t a single “right” answer."
            - listitem [ref=e398]:
              - paragraph [ref=e399]: Experience building eval datasets or frameworks to understand and improve the performance of AI systems is a plus.
            - listitem [ref=e400]:
              - paragraph [ref=e401]: Experience building products or tools used by other engineers is a plus.
          - paragraph
          - heading "Applying" [level=3] [ref=e402]
          - paragraph [ref=e403]: If there appears to be a fit, we'll reach to schedule 2-3 short technicals. After, we'll schedule an onsite in our office, where you'll work on a small project, discuss ideas, and meet the team.
          - paragraph
