                  - /placeholder: Type here...
                  - text: "Day to day I use LLM APIs for summarization and retrieval debugging, and I keep a Pinecone-backed vault (AI Mind) as a cited Q&A layer over my notes so answers stay grounded. The underappreciated benefit is second-scale re-index with Git hooks so the corpus stays fresh without overnight jobs. The pain point is still citation honesty under load: models sound confident when retrieval is thin, so I lean on grounding, latency tracking in Postgres, and stress testing the hot path the way I did with Causix and the UIDAI fraud service."
