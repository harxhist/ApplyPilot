                  - /placeholder: Type here...
                  - text: "The applied AI problem at Perplexity is grounding answers under real query load across SF, NYC, and Palo Alto traffic without trading away latency. I have already shipped that shape of work: AI Mind as incremental RAG over a 2.5GB corpus with Pinecone and cited answers, Causix in Go for call-type inference at 10K+ CPM, and a UIDAI fraud path that ran model scoring at 1,500+ entries per minute on Kafka. I want to harden ranking, retrieval, and citation paths so every answer stays correct when concurrent users spike."
              - generic [ref=e276]:
